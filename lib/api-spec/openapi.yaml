          type: string
      required:
        - publicOrigin
    FieldOptions:
      type: object
      properties:
        category:
          type: string
          enum: [window, interiorDoor, exteriorDoor]
        field: { type: string }
        parentField:
          type: string
          description: Empty for a flat list; otherwise the sibling field this list depends on (e.g. brand).
        parentValue:
          type: string
          description: Empty for a flat list; otherwise the parent field's value this list is scoped to (e.g. Andersen).
        grandField:
          type: string
          description: Empty unless two-level; the second-level ancestor field (e.g. brand for a color list scoped to Brand+Series).
        grandValue:
          type: string
          description: Empty unless two-level; the second-level ancestor value (e.g. Andersen).
        values:
          type: array
          items: { type: string }
      required: [category, field, parentField, parentValue, grandField, grandValue, values]
    DependentFieldOptionsInput:
      type: object
      properties:
        parentField: { type: string, minLength: 1, maxLength: 64 }
        parentValue: { type: string, minLength: 1, maxLength: 120 }
        grandField:
          type: string
          maxLength: 64
          description: Optional second-level ancestor field; must be provided together with grandValue.
        grandValue:
          type: string
          maxLength: 120
          description: Optional second-level ancestor value; must be provided together with grandField.
        replaceExisting:
          type: boolean
          description: >
            Required acknowledgment when this save would change the field's
            dependency chain (different parentField/grandField) and therefore
            delete lists scoped to the old chain. Without it such a save is
            rejected with 409.
        values:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 120 }
      required: [parentField, parentValue, values]
