    PacketRect:
      type: object
      properties:
        x: { type: number, minimum: 0 }
        y: { type: number, minimum: 0 }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, maxLength: 250 }
      required: [x, y, width, height]
    PacketPageAnalysis:
      type: object
      properties:
        pageNumber: { type: integer, minimum: 1 }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
        pageType: { type: string }
        suggestedRects:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PacketRect" }
      required: [pageNumber, width, height, pageType, suggestedRects]
    ManufacturerPacket:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        manufacturer: { type: ["string", "null"] }
        productType:
          type: ["string", "null"]
          enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork, null]
        detectedManufacturer: { type: ["string", "null"] }
        originalName: { type: string }
        status: { $ref: "#/components/schemas/PacketStatus" }
        pageCount: { type: ["integer", "null"] }
        analysis:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/PacketPageAnalysis" }
        manualRedactions:
          type: ["object", "null"]
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/PacketRect" }
        appliedTemplate:
          oneOf:
            - $ref: "#/components/schemas/AppliedManufacturerRedactionTemplate"
            - type: "null"
        failureMessage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvedAt: { type: ["string", "null"], format: date-time }
      required: [id, quoteId, originalName, status, createdAt, updatedAt]
    AppliedManufacturerRedactionTemplate:
      type: object
      properties:
        id: { type: integer }
