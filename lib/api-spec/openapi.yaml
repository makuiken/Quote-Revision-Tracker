openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quote Revision Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quotes
    description: Quote operations
  - name: revisions
    description: Revision log operations
  - name: signoff
    description: Signoff document operations
  - name: dashboard
    description: Dashboard summaries
  - name: storage
    description: Object storage upload and serving endpoints
  - name: attachments
    description: Quote file attachments
  - name: admin
    description: Team member administration (admin only)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /share-info:
    get:
      operationId: getShareInfo
      tags: [quotes]
      summary: Get the app's publicly reachable origin for building share links
      responses:
        "200":
          description: Public share info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareInfo"
  /me:
    get:
      operationId: getCurrentUser
      tags: [quotes]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quotes, newest first
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Match against quote number or customer name
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote with its revisions and signoff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote's info and specs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote and its history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/revisions:
    get:
      operationId: listRevisions
      tags: [revisions]
      summary: List a quote's revision log entries, oldest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revision entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Revision"
    post:
      operationId: createRevision
      tags: [revisions]
      summary: Add a revision log entry (author and timestamp are automatic)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/signoff:
    get:
      operationId: getSignoff
      tags: [signoff]
      summary: Get the signoff record for a quote (if signed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signoff record or null
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Signoff"
                  - type: "null"
    put:
      operationId: saveSignoff
      tags: [signoff]
      summary: Save (or replace) the customer signoff for a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignoffInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signoff"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearSignoff
      tags: [signoff]
      summary: Remove the signoff from a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared
  /quotes/{id}/share-link:
    post:
      operationId: createShareLink
      tags: [signoff]
      summary: Create (or return the existing) public share token for a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/signoff/{token}:
    get:
      operationId: getPublicSignoff
      tags: [signoff]
      summary: Publicly view a quote's signoff document via share token (no login)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote detail for signing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDetail"
        "404":
          description: Invalid or revoked link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: savePublicSignoff
      tags: [signoff]
      summary: Publicly save the customer signoff via share token (no login)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignoffInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signoff"
        "404":
          description: Invalid or revoked link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Counts of quotes, updates, and signed quotes
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Most recent revision entries across all quotes
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all team member accounts (admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/approve:
    post:
      operationId: approveUser
      tags: [admin]
      summary: Approve a pending sign-up request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/role:
    post:
      operationId: setUserRole
      tags: [admin]
      summary: Make a user an admin or a regular member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}:
    delete:
      operationId: removeUser
      tags: [admin]
      summary: Remove a user's access entirely (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/attachments:
    get:
      operationId: listAttachments
      tags: [attachments]
      summary: List attachments for a quote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAttachment
      tags: [attachments]
      summary: Record an uploaded attachment on a quote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentInput"
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteAttachment
      tags: [attachments]
      summary: Delete an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Attachment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    Attachment:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        name: { type: string }
        objectPath: { type: string }
        contentType: { type: ["string", "null"] }
        size: { type: ["integer", "null"] }
        uploadedByName: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, quoteId, name, objectPath, uploadedByName, createdAt]
    AttachmentInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        objectPath: { type: string, minLength: 1 }
        contentType: { type: ["string", "null"] }
        size: { type: ["integer", "null"] }
      required: [name, objectPath]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ShareLink:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    ShareInfo:
      type: object
      properties:
        publicOrigin:
          type: string
      required:
        - publicOrigin
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [pending, approved]
      required: [id, name, role, status]
    AppUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: ["string", "null"] }
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [pending, approved]
        createdAt: { type: string, format: date-time }
      required: [id, name, role, status, createdAt]
    UserRoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [admin, member]
      required: [role]
    WindowSpec:
      type: object
      properties:
        brand: { type: ["string", "null"] }
        series: { type: ["string", "null"] }
        exteriorColor: { type: ["string", "null"] }
        interiorColor: { type: ["string", "null"] }
        jambDepth: { type: ["string", "null"] }
        dividedLites: { type: ["string", "null"] }
        hardwareFinish: { type: ["string", "null"] }
        screenColor: { type: ["string", "null"] }
    DoorSpec:
      type: object
      properties:
        brand: { type: ["string", "null"] }
        seriesStyle: { type: ["string", "null"] }
        materialSpecies: { type: ["string", "null"] }
        exteriorColor: { type: ["string", "null"] }
        interiorFinish: { type: ["string", "null"] }
        jambDepth: { type: ["string", "null"] }
        hardwareFinish: { type: ["string", "null"] }
        glassLiteOptions: { type: ["string", "null"] }
    QuoteSpecs:
      type: object
      properties:
        window:
          anyOf:
            - $ref: "#/components/schemas/WindowSpec"
            - type: "null"
        door:
          anyOf:
            - $ref: "#/components/schemas/DoorSpec"
            - type: "null"
        trimDescription: { type: ["string", "null"] }
        millworkDescription: { type: ["string", "null"] }
    Quote:
      type: object
      properties:
        id: { type: integer }
        quoteNumber: { type: string }
        customerName: { type: string }
        projectName: { type: string }
        jobAddress: { type: string }
        displayName: { type: string }
        categories:
          type: array
          items:
            type: string
            enum: [doors, windows, trim, millwork]
        specs:
          $ref: "#/components/schemas/QuoteSpecs"
        notes: { type: ["string", "null"] }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revisionCount: { type: integer }
        lastActivityAt: { type: ["string", "null"], format: date-time }
        signed: { type: boolean }
      required:
        - id
        - quoteNumber
        - customerName
        - projectName
        - jobAddress
        - displayName
        - categories
        - specs
        - createdByName
        - createdAt
        - updatedAt
        - revisionCount
        - signed
    QuoteDetail:
      type: object
      properties:
        quote:
          $ref: "#/components/schemas/Quote"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        signoff:
          anyOf:
            - $ref: "#/components/schemas/Signoff"
            - type: "null"
      required: [quote, revisions]
    QuoteInput:
      type: object
      properties:
        quoteNumber:
          type: string
          pattern: "^[0-9]{7}$"
          description: BisTrack quote number (7 digits)
        customerName: { type: string, minLength: 1 }
        projectName: { type: string, minLength: 1 }
        jobAddress: { type: string, minLength: 1 }
        categories:
          type: array
          items:
            type: string
            enum: [doors, windows, trim, millwork]
          minItems: 1
        specs:
          $ref: "#/components/schemas/QuoteSpecs"
        notes: { type: ["string", "null"] }
      required: [quoteNumber, customerName, projectName, jobAddress, categories]
    QuoteUpdate:
      type: object
      properties:
        quoteNumber:
          type: string
          pattern: "^[0-9]{7}$"
          description: BisTrack quote number (7 digits)
        customerName: { type: string, minLength: 1 }
        projectName: { type: string, minLength: 1 }
        jobAddress: { type: string, minLength: 1 }
        categories:
          type: array
          items:
            type: string
            enum: [doors, windows, trim, millwork]
          minItems: 1
        specs:
          $ref: "#/components/schemas/QuoteSpecs"
        notes: { type: ["string", "null"] }
    Revision:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        authorName: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, quoteId, authorName, note, createdAt]
    RevisionInput:
      type: object
      properties:
        note: { type: string, minLength: 1 }
      required: [note]
    Signoff:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        customerName: { type: string }
        signatureType:
          type: string
          enum: [typed, drawn]
        signatureData: { type: string }
        signedAt: { type: string, format: date-time }
      required: [id, quoteId, customerName, signatureType, signatureData, signedAt]
    SignoffInput:
      type: object
      properties:
        customerName: { type: string, minLength: 1 }
        signatureType:
          type: string
          enum: [typed, drawn]
        signatureData: { type: string, minLength: 1 }
      required: [customerName, signatureType, signatureData]
    DashboardSummary:
      type: object
      properties:
        totalQuotes: { type: integer }
        totalRevisions: { type: integer }
        signedQuotes: { type: integer }
        quotesAwaitingSignoff: { type: integer }
      required: [totalQuotes, totalRevisions, signedQuotes, quotesAwaitingSignoff]
    ActivityEntry:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        quoteNumber: { type: string }
        customerName: { type: string }
        projectName: { type: string }
        authorName: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, quoteId, quoteNumber, customerName, projectName, authorName, note, createdAt]
