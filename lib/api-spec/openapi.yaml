  /public/signoff/{token}/packet:
    get:
      operationId: getPublicManufacturerPacket
      tags: [manufacturer-packets]
      summary: Get public metadata for the current approved packet only
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Approved packet metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicManufacturerPacket" }
  /public/scoped-signoff/{token}/packet:
    get:
      operationId: getPublicScopedManufacturerPacket
      tags: [manufacturer-packets]
      summary: Get scoped sanitized packet metadata
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Scoped packet metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicManufacturerPacket" }
  /public/signoff/{token}/packet/pages/{pageNumber}:
    get:
      operationId: getPublicManufacturerPacketPage
      tags: [manufacturer-packets]
      summary: Stream an approved sanitized packet PNG page
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/PacketPageNumber"
        - name: documentVersion
          in: query
          required: true
          description: Version loaded with the public signoff document; stale versions cannot fetch newer pages.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Approved sanitized PNG page
          content:
            image/png:
              schema: { type: string, format: binary }
  /public/scoped-signoff/{token}/packet/pages/{pageNumber}:
    get:
      operationId: getPublicScopedManufacturerPacketPage
      tags: [manufacturer-packets]
      summary: Stream a page from the locked scoped packet only
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/PacketPageNumber"
        - name: documentVersion
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Approved scoped sanitized PNG page
          content:
            image/png:
              schema: { type: string, format: binary }
  /public/signoff/{token}/document:
    get:
      operationId: getPublicSignoffDocument
      tags: [signoff]
      summary: Download the current unsigned or immutable signed combined PDF
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Combined signoff PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /public/scoped-signoff/{token}/document:
    get:
      operationId: getPublicScopedSignoffDocument
      tags: [signoff]
      summary: Download the locked unsigned or immutable signed scoped PDF
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Scoped signoff PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
components:
  parameters:
    QuoteId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PacketId:
      name: packetId
      in: path
      required: true
      schema: { type: integer }
    PacketPageNumber:
      name: pageNumber
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ShareToken:
      name: token
      in: path
      required: true
      schema: { type: string }
  schemas:
    QuoteProductType:
      type: string
      enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork]
    PacketStatus:
