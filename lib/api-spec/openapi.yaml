          items:
            type: string
            enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork]
          minItems: 1
        specs:
          $ref: "#/components/schemas/QuoteSpecs"
        notes: { type: ["string", "null"] }
      required: [quoteNumber, customerName, projectName, jobAddress, categories]
    QuoteUpdate:
      type: object
      properties:
        quoteNumber:
          type: string
          pattern: "^[0-9]{7}$"
          description: BisTrack quote number (7 digits)
        customerName: { type: string, minLength: 1 }
        projectName: { type: string, minLength: 1 }
        jobAddress: { type: string, minLength: 1 }
        categories:
          type: array
          items:
            type: string
            enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork]
          minItems: 1
        specs:
          $ref: "#/components/schemas/QuoteSpecs"
        notes: { type: ["string", "null"] }
    Revision:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        authorName: { type: string }
        note: { type: string }
        categories:
          $ref: "#/components/schemas/RevisionCategories"
        excludedFromSignoff: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, quoteId, authorName, note, excludedFromSignoff, createdAt]
    RevisionCategories:
      description: Optional category tags (subset of the quote's categories); empty/absent means the revision applies to the whole quote
      type: ["array", "null"]
      items:
        type: string
        enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork]
    RevisionInput:
      type: object
      properties:
        note: { type: string, minLength: 1 }
        categories:
          $ref: "#/components/schemas/RevisionCategories"
      required: [note]
    RevisionDraft:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        note: { type: string }
        categories:
          $ref: "#/components/schemas/RevisionCategories"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, quoteId, note, createdAt, updatedAt]
    RevisionDraftLookup:
      type: object
      properties:
        draft:
          oneOf:
            - $ref: "#/components/schemas/RevisionDraft"
            - type: "null"
      required: [draft]
    RevisionDraftInput:
      type: object
      properties:
        note: { type: string, minLength: 1 }
        categories:
          $ref: "#/components/schemas/RevisionCategories"
      required: [note]
    RevisionExclusionInput:
      type: object
      properties:
        excludedFromSignoff:
          type: boolean
          description: Hide (true) or show (false) this revision on the signoff document only
      required: [excludedFromSignoff]
    Signoff:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        customerName: { type: string }
        stakeholderRole:
          type: string
          enum: [Homeowner, Contractor, Architect/Designer, Other]
        signatureType:
          type: string
          enum: [typed, drawn]
        signatureData: { type: string }
        signedAt: { type: string, format: date-time }
      required: [id, quoteId, customerName, stakeholderRole, signatureType, signatureData, signedAt]
    LegacyApproval:
      description: Legacy whole-quote evidence is never rendered against mutable HTML.
      type: object
      properties:
        status: { type: string, enum: [legacy] }
        validity: { type: string, enum: [signed, needs_resigning] }
        signedAt: { type: string, format: date-time }
        documentAvailable: { type: boolean }
        invalidationReason: { type: ["string", "null"] }
      required: [status, validity, signedAt, documentAvailable]
    SignoffInput:
      type: object
      properties:
        customerName: { type: string, minLength: 1 }
        stakeholderRole:
          type: string
          enum: [Homeowner, Contractor, Architect/Designer, Other]
        signatureType:
          type: string
          enum: [typed, drawn]
        signatureData: { type: string, minLength: 1 }
        documentVersion:
          type: string
          minLength: 1
          description: The documentVersion the signer loaded; signing is rejected if the document has changed since
      required: [customerName, stakeholderRole, signatureType, signatureData, documentVersion]
    ApprovalCoverage:
      type: object
      properties:
        productType:
          type: string
          enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork]
        status:
          type: string
          enum: [open, signed, needs_resigning]
        approvalId: { type: ["integer", "null"] }
        invalidationReason: { type: ["string", "null"] }
      required: [productType, status]
    ScopedApprovalInput:
      type: object
      properties:
        productTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork]
      required: [productTypes]
    ScopedApproval:
      type: object
      properties:
        id: { type: integer }
        approvalId: { type: ["integer", "null"] }
        token: { type: string }
        productTypes:
          type: array
          items: { type: string, enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork] }
        notIncludedProductTypes:
          type: array
          items: { type: string, enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork] }
        preparedAt: { type: string, format: date-time }
        documentVersion: { type: string }
        publicPath: { type: string }
        status: { type: string, enum: [open, signed, needs_resigning] }
        signedAt: { type: ["string", "null"], format: date-time }
      required: [token, productTypes, notIncludedProductTypes, documentVersion, status]
    ScopedApprovalsResponse:
      type: object
      properties:
        approvals:
          type: array
          items: { $ref: "#/components/schemas/ScopedApproval" }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/ApprovalCoverage" }
      required: [approvals, coverage]
    ScopedSignoffDetail:
      type: object
      properties:
        quote: { $ref: "#/components/schemas/ScopedPublicQuote" }
        revisions:
          type: array
          items: { $ref: "#/components/schemas/Revision" }
        signoff:
          anyOf: [{ $ref: "#/components/schemas/Signoff" }, { type: "null" }]
        approval:
          anyOf: [{ $ref: "#/components/schemas/Signoff" }, { type: "null" }]
        productTypes:
          type: array
          items: { type: string, enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork] }
        notIncludedProductTypes:
          type: array
          items: { type: string, enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork] }
        preparedAt:
          type: string
          format: date-time
          description: Locked preparation time of this scoped approval snapshot.
        documentVersion: { type: string }
        status: { type: string, enum: [open, signed, needs_resigning] }
      required: [quote, revisions, productTypes, notIncludedProductTypes, preparedAt, documentVersion, status]
    ScopedPublicQuote:
      description: Strict public projection for a locked scoped request.
      type: object
      properties:
        id: { type: integer }
        quoteNumber: { type: string }
        customerName: { type: string }
        projectName: { type: string }
        jobAddress: { type: string }
        displayName: { type: string }
        categories:
          type: array
          items: { type: string, enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork] }
        specs: { $ref: "#/components/schemas/QuoteSpecs" }
        notes: { type: [string, "null"] }
      required: [id, quoteNumber, customerName, projectName, jobAddress, displayName, categories, specs]
    DashboardSummary:
      type: object
      properties:
        totalQuotes: { type: integer }
        totalRevisions: { type: integer }
        signedQuotes: { type: integer }
        quotesAwaitingSignoff: { type: integer }
      required: [totalQuotes, totalRevisions, signedQuotes, quotesAwaitingSignoff]
    ActivityEntry:
      type: object
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        quoteNumber: { type: string }
        customerName: { type: string }
        projectName: { type: string }
        authorName: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, quoteId, quoteNumber, customerName, projectName, authorName, note, createdAt]
