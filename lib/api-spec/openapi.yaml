openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quote Revision Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quotes
    description: Quote operations
  - name: revisions
    description: Revision log operations
  - name: signoff
    description: Signoff document operations
  - name: dashboard
    description: Dashboard summaries
  - name: storage
    description: Object storage upload and serving endpoints
  - name: attachments
    description: Quote file attachments
  - name: manufacturer-packets
    description: Manufacturer PDF packet review, approval, and signoff inclusion
  - name: admin
    description: Team member administration (admin only)
  - name: template-admin
    description: Standalone manufacturer template authoring (admin only)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /share-info:
    get:
      operationId: getShareInfo
      tags: [quotes]
      summary: Get the app's publicly reachable origin for building share links
      responses:
        "200":
          description: Public share info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareInfo"
  /me:
    get:
      operationId: getCurrentUser
      tags: [quotes]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listTeamMembers
      tags: [quotes]
      summary: List approved team members (for filtering)
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
  /field-options:
    get:
      operationId: listFieldOptions
      tags: [quotes]
      summary: List admin-configured dropdown options for product spec fields
      responses:
        "200":
          description: All configured field option lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldOptions"
  /admin/field-options/{category}/{field}:
    put:
      operationId: setFieldOptions
      tags: [admin]
      summary: Create or replace the option list for a spec field (admin only)
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [window, interiorDoor, exteriorDoor]
        - name: field
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldOptionsInput"
      responses:
        "200":
          description: Saved option list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldOptions"
        "400":
          description: Invalid category, field, or values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFieldOptions
      tags: [admin]
      summary: Remove the option list for a spec field so it reverts to free text (admin only)
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [window, interiorDoor, exteriorDoor]
        - name: field
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "204":
          description: Removed (no-op if none existed)
        "400":
          description: Invalid category or field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /manufacturer-redaction-template-options:
    get:
      operationId: listManufacturerRedactionTemplateOptions
      tags: [manufacturer-packets]
      summary: List active manufacturer choices available to approved salespeople
      responses:
        "200":
          description: Active manufacturer and product type combinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManufacturerRedactionTemplateOption"
  /admin/manufacturer-redaction-templates:
    get:
      operationId: listManufacturerRedactionTemplates
      tags: [admin]
      summary: List manufacturer redaction templates (admin only)
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManufacturerRedactionTemplate" }
    post:
      operationId: createManufacturerRedactionTemplate
      tags: [admin]
      deprecated: true
      summary: Retired packet-based template creation endpoint
      responses:
        "410":
          description: Use the standalone template draft upload and save workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/manufacturer-redaction-templates/{id}:
    patch:
      operationId: updateManufacturerRedactionTemplate
      tags: [admin]
      summary: Update template metadata or active state (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerRedactionTemplateUpdateInput" }
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerRedactionTemplate" }
        "404":
          description: Template not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteManufacturerRedactionTemplate
      tags: [admin]
      summary: Delete a manufacturer redaction template (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "404":
          description: Template not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/manufacturer-redaction-templates/{id}/from-packet:
    put:
      operationId: replaceManufacturerRedactionTemplateFromPacket
      tags: [admin]
      deprecated: true
      summary: Retired packet-based template replacement endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "410":
          description: Use the standalone template draft upload and save workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/template-drafts/uploads/request-url:
    post:
      operationId: requestTemplateDraftUploadUrl
      tags: [template-admin]
      summary: Create a standalone template draft and request a private sample upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateUploadInput" }
      responses:
        "201":
          description: Draft and presigned upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateUploadDraftResponse" }
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/manufacturer-redaction-templates/{id}/drafts:
    post:
      operationId: createManufacturerRedactionTemplateDraft
      tags: [template-admin]
      summary: Open an edit draft, optionally requesting an explicit sample replacement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateEditDraftInput" }
      responses:
        "201":
          description: Edit draft, with upload URL when replacing the sample
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TemplateUploadDraftResponse"
                  - $ref: "#/components/schemas/TemplateDraftResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/template-drafts/{draftId}:
    get:
      operationId: getTemplateDraft
      tags: [template-admin]
      summary: Get a standalone template draft
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Template draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftResponse" }
        "404":
          description: Draft not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: cancelTemplateDraft
      tags: [template-admin]
      summary: Cancel a template draft without changing a saved template
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Cancelled (idempotent for an already-cancelled draft) }
        "404":
          description: Draft not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/template-drafts/{draftId}/analyze:
    post:
      operationId: analyzeTemplateDraft
      tags: [template-admin]
      summary: Analyze an uploaded private template sample with bounded processing
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyzeTemplateDraftInput" }
      responses:
        "200":
          description: Analyzed draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftResponse" }
        "409":
          description: Draft busy, stale, or retry limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid PDF or bounded processing failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/template-drafts/{draftId}/redactions:
    patch:
      operationId: updateTemplateDraftRedactions
      tags: [template-admin]
      summary: Save explicit redaction geometry on a template draft
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateRedactionsInput" }
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftResponse" }
        "400":
          description: Invalid page geometry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/template-drafts/{draftId}/source/pages/{pageNumber}:
    get:
      operationId: getTemplateDraftSourcePage
      tags: [template-admin]
      summary: Render one private original source page for an administrator
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
        - name: pageNumber
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Original page PNG (admin only)
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: Draft or retained source sample not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/template-drafts/{draftId}/preview:
    post:
      operationId: previewTemplateDraft
      tags: [template-admin]
      summary: Render a cleaned page preview without saving a template
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplatePreviewInput" }
      responses:
        "200":
          description: Cleaned page PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "409":
          description: Draft is not ready for preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/template-drafts/{draftId}/save:
    post:
      operationId: saveTemplateDraft
      tags: [template-admin]
      summary: Atomically create or update a manufacturer template from a ready draft
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateSaveInput" }
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerRedactionTemplate" }
        "201":
          description: Created template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerRedactionTemplate" }
        "409":
          description: Stale edit or manufacturer/product type conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Template or packet not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/field-options/{category}/{field}/dependent:
    put:
      operationId: setDependentFieldOptions
      tags: [admin]
      summary: Create or replace the option list for a spec field scoped to a parent field value (admin only)
      description: >
        Declares/extends a dependency: when the quote form's parent field
        equals parentValue (and, for two-level chains, the grand field equals
        grandValue), the dependent field suggests these values. Saving under a
        different dependency chain (parentField/grandField) is rejected with
        409 unless replaceExisting is true, in which case lists scoped to the
        old chain are deleted.
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [window, interiorDoor, exteriorDoor]
        - name: field
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DependentFieldOptionsInput"
      responses:
        "200":
          description: Saved scoped option list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldOptions"
        "400":
          description: Invalid category, field, parent, or values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Save would change the dependency chain and delete existing lists; retry with replaceExisting true to confirm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/field-options/{category}/{field}/dependent/{parentValue}:
    delete:
      operationId: deleteDependentFieldOptions
      tags: [admin]
      summary: Remove the option list scoped to one parent value (admin only)
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [window, interiorDoor, exteriorDoor]
        - name: field
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: parentValue
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: grandValue
          in: query
          required: false
          description: For two-level lists, the grand ancestor value identifying the exact list; omit for one-level lists.
          schema:
            type: string
            maxLength: 120
      responses:
        "204":
          description: Removed (no-op if none existed)
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/field-options/{category}/{field}/dependency:
    delete:
      operationId: clearFieldDependency
      tags: [admin]
      summary: Remove a field's dependency entirely (all parent-scoped lists) so it reverts to its flat list or free text (admin only)
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [window, interiorDoor, exteriorDoor]
        - name: field
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "204":
          description: Dependency removed (no-op if none existed)
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quotes, newest first (filtered and paginated server-side)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Match against quote number or customer name
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, awaiting, signed, partial, needs_resigning, archived]
          description: >
            Filter by status. "active" = not archived; "awaiting" = active and
            not signed; "signed" = active and fully signed; "partial" = at
            least one but not every active type signed; "needs_resigning" =
            at least one type invalidated; "archived" = archived
            only. Omitted = all quotes including archived.
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [doors, interiorDoors, exteriorDoors, windows, trim, millwork]
          description: Only quotes that include this category
        - name: createdById
          in: query
          required: false
          schema:
            type: string
          description: Only quotes created by this user ID
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of quotes to skip (for pagination)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of quotes to return
      responses:
        "200":
          description: A page of quotes plus the total match count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteList"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote with its revisions and signoff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote's info and specs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote and its history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/archive:
    post:
      operationId: archiveQuote
      tags: [quotes]
      summary: Archive a quote with a required reason (kept, not deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveQuoteInput"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Missing reason or quote already archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/unarchive:
    post:
      operationId: unarchiveQuote
      tags: [quotes]
      summary: Restore an archived quote to active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Quote is not archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/revision-draft:
    get:
      operationId: getRevisionDraft
      tags: [revisions]
      summary: Get the current user's private draft revision note for a quote, if any
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The user's draft for this quote, or null if none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionDraftLookup"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveRevisionDraft
      tags: [revisions]
      summary: Create or update the current user's private draft revision note for a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionDraftInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionDraft"
        "400":
          description: Quote is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: discardRevisionDraft
      tags: [revisions]
      summary: Discard the current user's draft revision note for a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Draft discarded (no-op if none existed)
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/revision-draft/publish:
    post:
      operationId: publishRevisionDraft
      tags: [revisions]
      summary: Publish a revision entry from the user's draft (or the provided note) and delete the draft atomically
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: Optional latest note text; when provided it supersedes the stored draft so an in-flight auto-save can never overtake the publish
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionDraftInput"
      responses:
        "201":
          description: Revision created from the draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "400":
          description: Quote archived or no draft to publish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/revisions:
    get:
      operationId: listRevisions
      tags: [revisions]
